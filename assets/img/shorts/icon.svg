<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#7B6BFF"/><stop offset=".55" stop-color="#4A3BDB"/><stop offset="1" stop-color="#2A1E9E"/></linearGradient>
    <radialGradient id="sheen" cx=".3" cy=".15" r=".8"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <linearGradient id="hot" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#FF4FA3"/><stop offset="1" stop-color="#FFB547"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#14095e" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="228" fill="url(#sheen)"/>
  <!-- vertical reel frame -->
  <g filter="url(#sh)">
    <rect x="318" y="196" width="388" height="632" rx="86" fill="#fff"/>
    <!-- play -->
    <path d="M452 404 L452 620 Q452 650 478 636 L640 544 Q664 530 640 516 L478 388 Q452 374 452 404 Z" fill="#4A3BDB"/>
  </g>
  <!-- maxx: double chevron up, top-right -->
