    <circle cx="742" cy="282" r="132" fill="url(#hot)"/>
    <path d="M690 318 L742 266 L794 318" fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M690 254 L742 202 L794 254" fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" opacity=".75"/>
  </g>
</svg>
