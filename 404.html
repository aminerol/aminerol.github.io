<!doctype html>

    <style>
      :root { --bg: #07070b; --text: #f4f3ff; --text-2: #a9a7c6; --stroke: rgba(255,255,255,.1); --phone: #111118; --accent: #0a84ff; }
      @media (prefers-color-scheme: light) { :root { --bg: #f3f3f6; --text: #0c0c14; --text-2: #5d5b72; --stroke: rgba(0,0,0,.1); --phone: #ffffff; --accent: #0068d6; } }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { min-height: 100%; }
      body { background: var(--bg); color: var(--text); font-family: 'Instrument Sans', -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
      main { display: flex; align-items: center; gap: 64px; max-width: 920px; width: 100%; }
      .phone { flex: none; width: 220px; height: 450px; border-radius: 42px; background: var(--phone); box-shadow: 0 0 0 10px #050508, 0 40px 80px -30px rgba(0,0,0,.6); position: relative; display: grid; place-items: center; text-align: center; overflow: hidden; }
      .phone::before { content: ''; position: absolute; top: 12px; left: 50%; width: 80px; height: 24px; margin-left: -40px; border-radius: 14px; background: #000; }
      .bars { display: flex; gap: 5px; align-items: flex-end; justify-content: center; height: 28px; margin-bottom: 16px; }
      .bars i { width: 7px; border-radius: 2px; background: var(--stroke); }
      .bars i:nth-child(1) { height: 30%; background: var(--text-2); } .bars i:nth-child(2) { height: 55%; } .bars i:nth-child(3) { height: 78%; } .bars i:nth-child(4) { height: 100%; }
      .phone b { display: block; font-size: 64px; letter-spacing: -.04em; font-weight: 600; }
      .phone small { font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: .08em; color: var(--text-2); }
      h1 { font-size: clamp(40px, 6vw, 64px); line-height: 1.02; letter-spacing: -.035em; font-weight: 600; }
      h1 em { font-family: 'Instrument Serif', serif; font-weight: 400; background: linear-gradient(100deg, #8b7bff, #ff5ea8 60%, #ff8a4c); -webkit-background-clip: text; background-clip: text; color: transparent; padding-right: 4px; }
      p { margin-top: 16px; font-size: 18px; color: var(--text-2); line-height: 1.5; max-width: 440px; }
      .cta { display: flex; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
      a { display: inline-flex; align-items: center; height: 48px; padding: 0 20px; border-radius: 14px; font-weight: 600; text-decoration: none; font-size: 15px; transition: transform .16s cubic-bezier(.22,1,.36,1); }
      a:active { transform: scale(.98); }
      a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
      .primary { background: var(--text); color: var(--bg); }
      .ghost { border: 1px solid var(--stroke); color: var(--text); }
      @media (max-width: 720px) { main { flex-direction: column; gap: 40px; text-align: center; } p { margin-inline: auto; } .cta { justify-content: center; } .phone { width: 180px; height: 370px; } }
    </style>
  </head>

    <main>

        <div class="cta">

          <a class="ghost" href="/#projects">See the projects</a>
        </div>
      </div>
    </main>
  </body>
</html>
